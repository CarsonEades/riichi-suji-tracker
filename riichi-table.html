<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riichi Table Tracker</title>
<style>
:root{--felt:#1d4636;--card:#173a2d;--ivory:#f2ebd5;--ink:#1c1c1c;--m:#b5301f;--p:#1f4f9e;--s:#237a3f;--z:#333;--g:#46c27f;--j:#e8c15a;--h:#8a7632;--u:#264f40;--line:#2f5d4b}
*{box-sizing:border-box}
@media(min-width:2200px){html{zoom:1.3}}
body{margin:0;background:var(--felt);color:var(--ivory);font:14px/1.35 "Trebuchet MS",system-ui,sans-serif;padding:10px}
h1{font:600 22px Georgia,serif;margin:0 0 8px}h2{font:600 16px Georgia,serif;margin:0;margin-right:auto}
button{font:inherit;cursor:pointer;border:2px solid transparent;border-radius:7px;padding:5px 10px;background:var(--ivory);color:var(--ink)}
button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid var(--j);outline-offset:2px}
button:hover:not(:disabled){filter:brightness(1.08)}
.danger{background:#d9604c;color:#fff}
#table{display:grid;grid-template-columns:350px minmax(350px,1fr) 350px;grid-template-rows:1fr auto 1fr;grid-template-areas:"left top right" "left mid right" "left bottom right";gap:10px;max-width:1500px;margin:auto}
#table .a-left{grid-area:left;align-self:center}#table .a-right{grid-area:right;align-self:center}#table .a-mid{grid-area:mid}
#table .a-top{grid-area:top;align-self:end;justify-self:center;width:350px}#table .a-bottom{grid-area:bottom;align-self:start;justify-self:center;width:350px}
.seat,.mid{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;align-self:start}
.mid{text-align:center}.mid .row{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.hd{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.hd .tg{background:var(--u);color:var(--ivory)}.hd .tg.on{border-color:var(--j)}
.hd .ri.is{background:#d9604c;color:#fff}.hd .cl{background:#c98a2b;color:#fff}
.body{display:flex;flex-direction:column;gap:10px}
.pad,.grid{width:312px;display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.pad{align-content:start}
.t{position:relative;padding:4px 0;height:42px;background:var(--ivory);border-radius:5px;box-shadow:0 2px 0 #b9ae8c;text-align:center;line-height:1}
.t b{display:block;font-size:17px}.t i{display:block;font-style:normal;font-size:10px;margin-top:2px}
.m{color:var(--m)}.p{color:var(--p)}.s{color:var(--s)}.z{color:var(--z)}
.t .n{position:absolute;top:-5px;right:-3px;background:var(--ink);color:var(--ivory);font-size:10px;border-radius:9px;padding:1px 4px}
.h{font-size:16px;font-weight:700}.h5{font-size:13px}.t .h6{color:var(--m)}.t .h7{color:var(--s)}
.wd{display:inline-block;width:16px;height:22px;vertical-align:middle}
.river{display:flex;flex-wrap:wrap;gap:3px;min-height:24px}
.chip{background:var(--ivory);border-radius:4px;padding:1px 5px;font-size:12px;font-weight:700}
.chip.rm{background:#d9604c;color:#fff}.chip.cm{background:#c98a2b;color:#fff}.chip.tm{background:var(--u);color:var(--ivory);font-weight:400}
.c{height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.c i{font-style:normal;font-size:9px;margin-left:1px;opacity:.7}
.v3{background:var(--g);color:#06260f}.v2{background:var(--j);color:#2b2000}
.v1{background:var(--h);color:#fff8de}.v0{background:var(--u);color:#7fa898}
.lt{opacity:.6;outline:2px dashed var(--ivory);outline-offset:-3px}
.blank{visibility:hidden}
.sel{margin-top:6px;display:flex;gap:12px;font-size:13px;align-items:center}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:12px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;background:var(--c)}
</style></head><body>
<div id="table"></div>
<script>
/* ===== LOGIC (pure) ===== */
const NAMES=['You','Right','Across','Left'];
const HON=['E','S','W','N','Wh','R','G'];
const SUITS=['m','p','s','z'];
const SIZE={m:9,p:9,s:9,z:7};
const PARTNERS={1:[4],2:[5],3:[6],4:[1,7],5:[2,8],6:[3,9],7:[4],8:[5],9:[6]};
// events: d = discard {p,tile}, r = riichi {p}, x = toggle suspected tenpai {p}, c = call marker {p}
function derive(ev){
  const own=[0,1,2,3].map(()=>new Set()),soft=[0,1,2,3].map(()=>new Set());
  const tp=[0,0,0,0],R=[],cnt={};
  ev.forEach(e=>{
    if(e.t==='r')R.push({p:e.p,gen:new Set(own[e.p])});
    else if(e.t==='x'){tp[e.p]=!tp[e.p];if(!tp[e.p])soft[e.p].clear();}
    else if(e.t==='d'){
      own[e.p].add(e.tile);cnt[e.tile]=(cnt[e.tile]||0)+1;
      R.forEach(r=>r.gen.add(e.tile));
      for(let q=0;q<4;q++)if(q!==e.p&&tp[q])soft[q].add(e.tile);
    }
  });
  return {own,soft,tp,R,cnt};
}
// 3 = genbutsu, 2 = suji, 1 = half-suji, 0 = no info
function safety(tile,own,gen){
  if(gen.has(tile))return 3;
  const n=+tile[0],s=tile[1];
  if(s==='z')return 0;
  const hits=PARTNERS[n].filter(k=>own.has(k+s)).length;
  return hits===PARTNERS[n].length?2:hits?1:0;
}
// level of tile t against seat p -> [level, isProbable]
function lv(d,p,t){
  const r=d.R.find(r=>r.p===p);
  if(r)return [safety(t,r.gen,r.gen),0];
  const a=safety(t,d.own[p],d.own[p]);
  if(!d.tp[p])return [a,0];
  const u=new Set([...d.own[p],...d.soft[p]]);
  const b=safety(t,u,u);
  return b>a?[b,1]:[a,0];
}
/* ===== STATE ===== */
const KEY='riichiTable.v2';
let st={ev:[],sel:[0,0,0,0]};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.ev)){st=x;if(!st.sel)st.sel=[0,0,0,0];}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
let armed=false,tm;
/* ===== VIEW ===== */
const lab=t=>t[1]==='z'?`<span class="h h${t[0]}">${HON[t[0]-1]}</span>`:`${t[0]}<i>${t[1]}</i>`;
const chip=t=>`<span class="chip ${t[1]}">${t[1]==='z'?HON[t[0]-1]:t[0]+t[1]}</span>`;
const allTiles=SUITS.flatMap(s=>Array.from({length:SIZE[s]},(_,i)=>(i+1)+s));
function gridHTML(fn){
  return '<div class="grid">'+SUITS.map(s=>{
    let h='';
    for(let n=1;n<=9;n++){
      if(n>SIZE[s]){h+='<div class="c blank"></div>';continue;}
      const t=n+s,[v,l]=fn(t);
      h+=`<div class="c v${v}${l?' lt':''}">${lab(t)}</div>`;
    }
    return h;}).join('')+'</div>';
}
function combined(d){
  return t=>{
    const es=[1,2,3].filter(q=>st.sel[q]).map(q=>lv(d,q,t));
    if(!es.length)return [0,0];
    const m=Math.min(...es.map(e=>e[0]));
    return [m,es.filter(e=>e[0]===m).some(e=>e[1])?1:0];
  };
}
function seat(p,d,pos){
  const k=d.R.findIndex(r=>r.p===p);
  let items=[],on=false;
  st.ev.forEach(e=>{
    if(e.p!==p)return;
    if(e.t==='d')items.push(chip(e.tile));
    else if(e.t==='r')items.push('<span class="chip rm">riichi</span>');
    else if(e.t==='c')items.push('<span class="chip cm">call</span>');
    else{on=!on;items.push(`<span class="chip tm">${on?'tenpai?':'cleared'}</span>`);}
  });
  const pad=allTiles.map(t=>`<button class="t ${t[1]}" data-a="tile" data-p="${p}" data-t="${t}" aria-label="${NAMES[p]} discards ${t}">${d.cnt[t]?`<span class="n">${d.cnt[t]}</span>`:''}<b>${t==='5z'?'<span class="wd"></span>':lab(t).replace(/<i>.*<\/i>/,'')}</b><i>${t[1]==='z'?'':t[1]}</i></button>`).join('');
  let grid,extra='';
  if(p===0){
    grid=gridHTML(combined(d));
    extra='<div class="sel">Safest against: '+[3,2,1].map(q=>`<label><input type="checkbox" data-a="sel" data-p="${q}" ${st.sel[q]?'checked':''}> ${NAMES[q]}</label>`).join('')+'</div>';
  }else grid=gridHTML(t=>lv(d,p,t));
  return `<section class="seat a-${pos}"><div class="hd"><h2>${NAMES[p]}</h2>
    ${p?`<button class="tg ${d.tp[p]?'on':''}" data-a="tp" data-p="${p}" ${k>=0?'hidden':''}>Tenpai?</button>`:''}
    <button class="cl" data-a="call" data-p="${p}">Call</button>
    <button class="ri ${k>=0?'is':''}" data-a="riichi" data-p="${p}" ${k>=0?'disabled':''}>${k>=0?'Riichi #'+(k+1):'Riichi'}</button></div>
    <div class="body"><div class="pad">${pad}</div><div>${grid}${extra}</div><div class="river">${items.join('')||'<span style="opacity:.5">no discards</span>'}</div></div></section>`;
}
function render(){
  const d=derive(st.ev);
  document.getElementById('table').innerHTML=
    seat(2,d,'top')+seat(3,d,'left')+seat(1,d,'right')+seat(0,d,'bottom')+
    `<section class="mid a-mid"><h1>Riichi table</h1><div class="row"><button id="undo">Undo</button><button id="reset" class="danger">${armed?'Tap again to reset':'Reset'}</button></div>
    <div class="legend"><span style="--c:var(--g)">Safe (discarded)</span><span style="--c:var(--j)">Suji</span><span style="--c:var(--h)">Half-suji</span><span style="--c:var(--u)">No info</span><span style="--c:var(--ivory)">Pale dashed = probably (passed during suspected tenpai)</span></div></section>`;
}
/* ===== ACTIONS ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const a=b.dataset.a,p=+b.dataset.p;
  if(b.id!=='reset')armed=false;
  if(b.id==='undo'){const x=st.ev.pop();if(x&&x.prev!==undefined)st.sel[x.p]=x.prev;}
  else if(b.id==='reset'){
    if(!armed){armed=true;clearTimeout(tm);tm=setTimeout(()=>{armed=false;render();},3000);render();return;}
    armed=false;st={ev:[],sel:[0,0,0,0]};
  }
  else if(a==='tile')st.ev.push({t:'d',p,tile:b.dataset.t});
  else if(a==='riichi'){st.ev.push({t:'r',p,prev:st.sel[p]});st.sel[p]=true;}
  else if(a==='tp'){const was=derive(st.ev).tp[p];st.ev.push({t:'x',p,prev:st.sel[p]});st.sel[p]=!was;}
  else if(a==='call')st.ev.push({t:'c',p});
  else return;
  save();render();
});
document.addEventListener('change',e=>{
  const i=e.target;
  if(i.dataset.a==='sel'){st.sel[+i.dataset.p]=i.checked;save();render();}
});
render();
</script></body></html>
